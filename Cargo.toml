[package]
name = "cairnscope"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Local-first interactive source explorer: symbol graph + code, powered by SCIP indexes"
license = "Apache-2.0"
repository = "https://github.com/virajshoor/cairnscope"
homepage = "https://github.com/virajshoor/cairnscope"
readme = "README.md"
keywords = ["code-navigation", "scip", "call-graph", "source-explorer", "mcp"]
categories = ["development-tools", "command-line-utilities"]
exclude = ["/ui/node_modules", "/docs/assets/*.gif"]

[dependencies]
anyhow = "1.0.104"
blake3 = "1.8.7"
clap = { version = "4.6.7", features = ["derive"] }
dirs = "7.0.0"
ignore = "0.4.33"
notify = "8.2.1"
open = "5.4.5"
protobuf = "3.7.2"
rusqlite = { version = "0.41.0", features = ["bundled"] }
rust-embed = "8.13.0"
scip = "0.10.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tiny_http = "0.12.0"

[dev-dependencies]
tempfile = "3.27.0"
